async function readImp(f){
 if(!f)return;
 try{if(!window.XLSX)throw new Error("Excel library load hoyni.");
  var wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});

 }catch(x){imp=null;say(x.message||"File poRa jayni.","err")}}
